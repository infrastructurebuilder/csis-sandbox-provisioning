---
# Script lines that no task replaces, and why. tests/test_traceability.py
# requires every line of the scripts that does something to be either named by
# a task or listed here.

- file: setup-instance.sh
  lines: L6 L11
  why: >-
    Sourcing the versions and the function library. The versions are
    group_vars/all.yml and the functions are the roles.

- file: setup-instance.sh
  lines: L37
  why: >-
    Sourcing Spack's shell set-up into the script's shell. The tasks call
    Spack by its path, so nothing has to be sourced.

- file: setup-instance.sh
  lines: L57
  why: >-
    The time stamp for the fallback image name. group_vars/all.yml makes the
    same name.

- file: funcs-setup-instance.sh
  lines: L145
  why: >-
    Loads environment modules into the script's shell. Each task that needs
    the module command loads it for itself.

- file: funcs-setup-instance.sh
  lines: L177
  why: >-
    Switches to the stock network-latency profile. Thirty lines later the
    script switches to its own profile, which includes that one, so this
    switch has no lasting effect.

- file: funcs-setup-instance.sh
  lines: L250
  why: >-
    Shows the service's status in the log. It does not stop the script,
    whatever it shows.

- file: funcs-setup-instance.sh
  lines: L917
  why: Lists the installed Intel packages for the log.

- file: funcs-setup-instance.sh
  lines: L1075
  why: >-
    Empties the package manager's cache a second time. node-image.yml empties
    it before the image is taken.

- file: create_image.sh
  lines: L34
  why: >-
    Installs boto3 for the login user. The base_system role has already done
    that, as the script's own setup_environment has.

- file: funcs-setup-instance.sh
  lines: L958
  why: >-
    Adds spack-public again without a scope. Without a scope Spack v1.2.0
    looks at the merged configuration, finds the name (its own defaults
    and install_spack both define it) and stops with "already exists", so
    the command never has an effect; the script does not notice. The
    binary mirror it names is the one the spack role adds to the site
    scope.

# Stage 7: the operator scripts that the sandbox_users and jupyterhub roles
# replace.

- file: add-users.py
  lines: L29-L38 L44-L47
  why: >-
    A helper that hands a file to its user, and the paths of the files. Each
    task names its path and sets the owner itself.

- file: add-users.py
  lines: L115-L131 L201 L206
  why: >-
    Checks for an existing user or group, and the calls between the script's
    functions. The modules check the state themselves.

- file: add-users.py
  lines: L376-L404
  why: >-
    Reading the user list from system/ioos.sb.users, a CSV file that was
    never in the repository. The list is the variable sandbox_users_present,
    kept with the site's settings.

- file: add-users.py
  lines: L313-L335 L341-L358 L430-L442
  why: >-
    Asking whether to make a new machine image, and making it. That is
    node-image.yml, run after users.yml.

- file: add_group.sh
  lines: L5-L10
  why: >-
    A stub: it exits at L6 before creating its one group. Shared groups and
    their gids are part of sandbox_users_present.

- file: test_user.sh
  lines: L3-L9
  why: >-
    A stub: the user name is empty, so useradd fails. The users task does
    what it was for.

- file: system/sudoers.d_sandbox_modelers
  lines: L4-L8
  why: >-
    The same file as system/sudoers.d.sandbox-modelers, under a second name.
    sudo skips any file in /etc/sudoers.d whose name contains a dot, so the
    role installs it as /etc/sudoers.d/sandbox-modelers.

- file: install_conda_jupyterhub.sh
  lines: L40
  why: >-
    Turns SELinux enforcement off ("may or may not be needed") and never back
    on. Not carried: whether the service needs it on RHEL 10 is not proved
    yet (see docs/LIVE-PROOF.md); if it does, the run script needs a file
    context, not a system without enforcement.

- file: install_jupyterhub.sh
  lines: L1-L87
  why: >-
    The other of two JupyterHub installs: a pip environment in /opt/jupyterhub,
    Node.js 16 from NodeSource, Anaconda 2022.05 and a conda environment it
    never fills. The service file, the run script and jupyterhub/README.md
    describe the conda install, which the jupyterhub role translates.

# Stage 11: the site mirror's script, which the spack role's third list
# replaces.

- file: spack-pubkey.sh
  lines: L1
  why: >-
    Reads the versions and paths from environment-vars.sh. The role has them
    from group_vars/all.yml, where test_parity.py holds them to that file.

- file: spack-pubkey.sh
  lines: L12
  why: >-
    Lists Spack's keys on the terminal. The step that trusts the key reports
    the fingerprint it trusted.

# Cloud-Sandbox's spec 004: the lines of setup_spack-stack and
# build_spack-stack-environment that ufs-stack.yml does not carry.

- file: funcs-setup-instance.sh
  lines: L361-L364 L368 L371-L372
  why: >-
    spack-stack's own build cache: its key and its mirror. Spec 004 builds no
    cache for spack-stack, so its Spack is given none (FR-005); a later spec
    on that cache replaces these, with csis-sandbox-ops'
    spack-stack-update-mirror.sh and spack-stack-mirror-create.sh.

- file: funcs-setup-instance.sh
  lines: L380 L437
  why: >-
    A GCC toolset. The environment is built on RHEL 10's own GCC 14, and none
    is installed (spec 004, FR-002).

- file: funcs-setup-instance.sh
  lines: L390-L391 L409-L410
  why: >-
    The system scope pointed at the environment's site/ directory, for the
    lines that wrote to it, and back. The steps name the environment's own
    scope instead, and /etc/spack is never written to (spec 004, FR-004).

- file: funcs-setup-instance.sh
  lines: L416-L417
  why: >-
    The environment's module files switched from Tcl to Lmod. The sandbox's
    Environment Modules reads Tcl, and the script refreshed Tcl modules
    anyway (L458), which ufs-stack.yml does.
